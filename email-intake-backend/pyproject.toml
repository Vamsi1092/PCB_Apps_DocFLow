[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-flow-email-intake-backend"
version = "0.1.0"
description = "Accounts Payable email intake and document-processing backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.138.0",
    "uvicorn==0.49.0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "PyMuPDF==1.28.0",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "supabase==2.31.0",
    "oci==2.181.1",
    "json-repair==0.61.2",
    "reportlab==5.0.0",
]

[project.optional-dependencies]
legacy = ["groq==1.5.0"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["legacy*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
